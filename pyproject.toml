[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "venus-ai-sdk"
version = "0.1.0"
description = "SDK que armazena os agentes e fluxo do sistema de IA"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "python-dotenv",
    "langchain>=1.0",
    "langchain-core",
    "langchain-google-genai",
    "langchain-groq",
    "langchain-mistralai",
    "langgraph",
    "asyncpg",
    "langchain-text-splitters",
    "numpy",
    "httpx",
    "ddgs",
    "mcp",
    "langchain-mcp-adapters",
]

[project.optional-dependencies]
# pymongo e cryptography: os testes do MongoDBStore e do Google Calendar usam os dois.
# qdrant-client/llama-index: os testes do FAQ no Qdrant (em memória, sem FastEmbed).
dev = [
    "pytest", "pytest-asyncio", "pymongo", "cryptography",
    "qdrant-client", "llama-index-core", "llama-index-vector-stores-qdrant",
]
pdf = ["pypdf"]
mongo = ["langgraph-checkpoint-mongodb", "pymongo"]
a2a = ["a2a-sdk[http-server]", "uvicorn"]
google_calendar = ["cryptography"]
# Check-up da rotina no Neo4j (integrations/grafo_neo4j.py, checkup/).
neo4j = ["neo4j"]
# FAQ no Qdrant (rag/faq.py, rag/faq_ingest.py).
rag = ["qdrant-client", "llama-index-core", "llama-index-vector-stores-qdrant", "llama-index-embeddings-fastembed", "fastembed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exige Postgres real em DATABASE_URL com schema+seed aplicados (scripts/init_db.py); pulado por padrão",
]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
