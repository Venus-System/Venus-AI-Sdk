[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "venus-ai-sdk"
version = "0.1.0"
description = "SDK que armazena os agentes e fluxo do sistema de IA"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "python-dotenv",
    "langchain-core",
    "langchain-google-genai",
    "langchain-groq",
    "langgraph",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
