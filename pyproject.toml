[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "venus-ai-sdk"
version = "0.1.0"
description = "SDK que armazena os agentes e fluxo do sistema de IA"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "python-dotenv",
    "langchain-core",
    "langchain-google-genai",
    "langchain-groq",
    "langchain-mistralai",
    "langgraph",
    "asyncpg",
    "langchain-text-splitters",
    "numpy",
    "httpx",
    "ddgs",
    "mcp",
    "langchain-mcp-adapters",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
pdf = ["pypdf"]
mongo = ["langgraph-checkpoint-mongodb", "pymongo"]
a2a = ["a2a-sdk[http-server]", "uvicorn"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exige Postgres real em DATABASE_URL com schema+seed aplicados (scripts/init_db.py); pulado por padrão",
]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
