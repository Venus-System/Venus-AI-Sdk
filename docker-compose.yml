services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: venus
      POSTGRES_PASSWORD: venus
      POSTGRES_DB: venus
    ports:
      - "5432:5432"
    volumes:
      - venus_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venus"]
      interval: 5s
      retries: 10

volumes:
  venus_pg:
