name: Deploy Staging

on:
  push:
    branches: [develop]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build, test e publicar imagem
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install . pytest

      - name: Build e testes
        # exit code 5 = "no tests collected"; tolerado enquanto a suíte de
        # testes está sendo reconstruída durante a migração pro LangGraph.
        run: pytest || [ "$?" = "5" ]

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados do Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=staging
            type=sha,prefix=develop-,format=short

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy para QA
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Deploy pendente de host
        run: |
          echo "Imagem publicada: ${{ needs.build-and-push.outputs.image }}"
          echo "Host de QA ainda nao definido - nenhum deploy executado."