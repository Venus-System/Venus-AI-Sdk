name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install . pytest

      - name: Run tests
        # exit code 5 = "no tests collected"; tolerado enquanto a suíte de
        # testes está sendo reconstruída durante a migração pro LangGraph.
        run: pytest || [ "$?" = "5" ]